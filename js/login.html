<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container-fluid">
            <h1 class="header d-flex justify-content-center">User Registration</h1>
        <div class="container mt-4 d-flex justify-content-center">
            <div class="user col-lg-4 border rounded p-3">
                <form id="userForm" class="mb-4">
                    <div class="mb-3">
                        <label for="firstname" class="form-label fw-bold">First Name</label>
                        <input type="text" id="firstname" class="form-control" placeholder="Enter Your Name">
                    </div>

                    <div class="mb-3">
                        <label for="lastname" class="form-label fw-bold">Last Name</label>
                        <input type="text" id="lastname" class="form-control" placeholder="Enter Your Last Name">
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label fw-bold">Age</label>
                        <input type="number" id="age" class="form-control" placeholder="Enter Your Age">
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label fw-bold">Gender</label>
                        <select id="gender" class="form-select mb-3">
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-info w-50 ">Submit</button>
                    <p id="error" class="text-danger mt-2"></p>
                </form>
            </div>
            <div class="userData col-lg-8 border rounded ms-4">
               
                    <table class="table table-bordered table-striped text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Gender</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">

                        </tbody>
                    </table>
                
            </div>
        </div>
    </div>
</body>
</html>
